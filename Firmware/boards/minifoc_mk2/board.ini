; MiniFOC Mk2. Included by platformio.ini (extra_configs = boards/*/board.ini).

[env:minifoc_mk2]
extends = board_firmware
board = genericSTM32G431CB
; The last 2 KB flash page holds the settings and the anti-cogging table,
; so the image must stay below the MCU's flash size minus 2 KB: 126 KB on the
; STM32G431CB (settings page at 0x0801F800). This makes an oversized build
; fail at build time (the firmware also checks at boot). Change it with the MCU.
board_upload.maximum_size = 129024
build_flags =
	${board_firmware.build_flags}
	-I boards/minifoc_mk2
	-D USB_PRODUCT="\"MiniFOC\""
	; No ADC_SAMPLINGTIME override: SimpleFOC's InlineCurrentSense reads the
	; phases with analogRead() on STM32, so a long sample time would slow the
	; FOC loop (and the INA241 outputs are low impedance anyway).

[env:minifoc_mk2_test]
extends = env:minifoc_mk2
build_src_filter = ${board_firmware.test_src_filter}
